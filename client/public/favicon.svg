<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Graduation Cap Rhombus -->
  <path d="M 32 14 L 54 25 L 32 36 L 10 25 Z" fill="url(#capGrad)" filter="url(#glow)" />

  <!-- Cap Underbody -->
  <path d="M 18 30.5 L 18 41 C 18 47 46 47 46 41 L 46 30.5 L 32 37.5 Z" fill="#e0e7ff" opacity="0.9" />

  <!-- Tassel Ribbon & Drop -->
  <path d="M 48 28 L 52 38 L 50 45" stroke="#facc15" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="50" cy="45" r="2.5" fill="#facc15" />

  <!-- AI Sparkle / Star in Center-Bottom -->
  <g transform="translate(32, 48) scale(0.9)" filter="url(#glow)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="url(#sparkGrad)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
</svg>
